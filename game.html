<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Protector: You</title>
<meta name="description" content="Learn to protect the planet that protects you.">
<style>
:root { --gold: #ffd65a; --ink: #eaf2ff; --muted: #a8bbd8; --glass: rgba(10, 20, 48, 0.72); --line: rgba(255,255,255,0.14); --teal: #36d6c3; --r: 18px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #050816; color: var(--ink); font: 16px/1.45 ui-rounded, "Segoe UI Rounded", "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui > .bubble, #ui > .float { pointer-events: none; } /* never block taps */
.hidden { display: none !important; }
h2 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 30px); letter-spacing: .3px; }
h3 { margin: 0 0 10px; font-size: 18px; text-shadow: 0 2px 8px #000; }
label { display: block; margin: 12px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
.hint { color: var(--muted); font-size: 14px; margin: 6px 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.row.center { justify-content: center; } .row.end { justify-content: flex-end; }
.btn { min-height: 48px; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, background .2s, box-shadow .2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.16); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, #ffe17a, #f5b928); color: #2a1a00; border: 0; box-shadow: 0 6px 24px rgba(255,200,60,.35), inset 0 -3px 0 rgba(0,0,0,.15); }
.btn.xl { min-height: 58px; padding: 14px 34px; font-size: 19px; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 14px; }
.btn.ghost.on { background: var(--teal); color: #032; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); font: inherit; }

.panel { position: absolute; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; max-height: calc(100% - 32px); overflow: auto; }
.panel.side { right: 16px; top: 16px; width: min(400px, calc(100% - 32px)); }
.panel.center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(980px, calc(100% - 32px)); animation: pop .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(30px); } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -46%) scale(.96); } }

/* title */
.title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 7vh 16px 0; text-align: center; }
.logo { display: flex; flex-direction: column; align-items: center; line-height: .9; animation: slam 1.1s cubic-bezier(.2,1.4,.4,1) both; }
.logo .pre { font-size: 18px; letter-spacing: 10px; color: var(--muted); }
.logo .big { font-size: clamp(46px, 10vw, 112px); font-weight: 900; letter-spacing: 2px; background: linear-gradient(180deg, #fff 30%, #ffd65a 80%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 30px rgba(255,200,80,.35)); }
.logo .you { font-size: clamp(28px, 5vw, 52px); font-weight: 900; letter-spacing: 16px; color: var(--teal); margin-top: 6px; }
@keyframes slam { from { opacity: 0; transform: scale(1.6); filter: blur(10px); } }
.tag { font-size: clamp(16px, 2.2vw, 22px); margin: 18px 0 6px; text-shadow: 0 2px 10px #000; }
.sub { position: absolute; bottom: 20px; left: 16px; right: 16px; color: var(--muted); font-size: 14px; }

/* intro */
.intro { position: absolute; inset: 0; }
.caption { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); text-align: center; font-size: clamp(18px, 2.6vw, 26px); font-weight: 600; text-shadow: 0 2px 14px #000, 0 0 2px #000; opacity: 0; transition: opacity .5s; min-height: 3em; }
.caption.show { opacity: 1; }
.skip { position: absolute; top: 16px; right: 16px; }

/* creator */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches .sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.swatches .sw.on { border-color: var(--gold); transform: scale(1.1); }
.seg { display: flex; background: rgba(0,0,0,.3); border-radius: 999px; padding: 4px; gap: 4px; margin-top: 8px; }
.seg button, .tog { flex: 1; min-height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.seg button.on, .tog.on { background: var(--gold); color: #2a1a00; }
.toggles { display: flex; gap: 8px; margin-top: 14px; }
.tog { border: 1px solid var(--line); }
.creator .primary { width: 100%; margin-top: 12px; }

/* location */
.loc-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 10px; }
.map { width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; cursor: crosshair; display: block; border: 1px solid var(--line); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-align: start; padding: 6px 10px; display: flex; flex-direction: column; }
.chip small { color: var(--muted); font-weight: 500; font-size: 12px; }
.chip:hover, .res:hover { background: rgba(255,214,90,.18); }
.results { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.res { min-height: 44px; text-align: start; padding: 8px 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,.06); color: var(--ink); font: inherit; cursor: pointer; }
.res small { color: var(--muted); }
.picked { margin-inline-end: auto; color: var(--gold); }
.credits { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

/* scan */
.scan { position: absolute; left: 0; right: 0; bottom: 9vh; text-align: center; text-shadow: 0 2px 10px #000; }
.scan p { font-size: 20px; font-weight: 700; margin: 10px 0 4px; }
.scan small { color: var(--gold); }
.ring { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); border-top-color: var(--gold); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hud */
.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 12px 16px; flex-wrap: wrap; background: linear-gradient(180deg, rgba(0,0,0,.5), transparent); }
.hud .id { display: flex; flex-direction: column; } .hud .nick { font-size: 18px; color: var(--gold); } .hud .rank { font-size: 13px; color: var(--ink); }
.badge { font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 999px; letter-spacing: .5px; }
.badge.live { background: rgba(54,214,195,.2); color: #8ff5e8; border: 1px solid #36d6c3; }
.badge.sample { background: rgba(255,150,60,.2); color: #ffc48a; border: 1px solid #ff9a3c; }
.hud-btns { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; } .hud-btns .btn { white-space: nowrap; }

/* hub */
.hub { position: absolute; left: 16px; right: 16px; bottom: 16px; animation: rise .5s both; }
.cards { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; }
.card { scroll-snap-align: start; flex: 0 0 min(260px, 78vw); min-height: 132px; text-align: start; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); color: var(--ink); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; transition: transform .2s, box-shadow .2s; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 0 2px var(--gold); }
.card .ic { font-size: 26px; } .card b { font-size: 18px; } .card .sz { font-size: 14px; color: var(--muted); }
.card .st { margin-top: auto; display: flex; gap: 4px; align-items: center; }
.card em { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--teal); color: #032; margin-inline-start: 6px; }
.card em.smp { background: #ff9a3c; color: #301400; }
.card.done { border-color: var(--teal); }
.fx-heat .ic, .fx-drying .ic, .fx-hotground .ic { color: #ffb347; } .fx-cold .ic, .fx-frost .ic, .fx-snowpack .ic { color: #bfe6ff; } .fx-flooding .ic, .fx-soggy .ic, .fx-streams .ic, .fx-melt .ic { color: #6cc4ff; } .fx-drysoil .ic, .fx-drybed .ic, .fx-browner .ic, .fx-wilting .ic { color: #d9a46a; }
.fx-steamy .ic, .fx-muggy .ic { color: #dfe8ee; } .fx-crisp .ic, .fx-clear .ic { color: #8fd8ff; } .fx-smog .ic { color: #d6d0b0; } .fx-greener .ic { color: #8fe08a; }
i { font-style: normal; color: rgba(255,255,255,.2); font-size: 20px; } i.gold { color: var(--gold); text-shadow: 0 0 10px rgba(255,214,90,.7); } i.silver { color: #dfe7f2; }
.weak { background: var(--glass); border-radius: 12px; padding: 8px 14px; margin-top: 6px; border: 1px solid var(--line); font-size: 14px; }
.weak summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.weak ul { margin: 4px 0; padding-inline-start: 18px; }
.notice { background: rgba(255,150,60,.9); color: #241000; font-weight: 700; padding: 8px 14px; border-radius: 12px; margin-bottom: 8px; display: inline-block; }

/* mission */
.mission { left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); max-height: 62vh; animation: none; }
.mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; } .mhead .ic { font-size: 24px; } .mhead b { font-size: 20px; }
.step { margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); }
.big { font-size: clamp(17px, 2.2vw, 21px); margin: 6px 0 12px; }
.evidence { display: flex; gap: 16px; align-items: flex-start; }
.arrow { font-size: 44px; line-height: 1; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.08); }
.arrow.increasing { color: #ff8f5a; } .arrow.decreasing { color: #6cc4ff; }
.verdict span { color: var(--muted); } .verdict b { color: var(--teal); letter-spacing: .5px; }
.warn { color: #ffc48a; font-weight: 700; font-size: 14px; }
.power { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--teal); margin: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { min-height: 56px; text-align: start; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.07); color: var(--ink); font: inherit; font-size: 16px; cursor: pointer; transition: transform .15s, background .2s, border-color .2s; }
.opt:hover { border-color: var(--gold); transform: translateX(4px); }
.opt.right { background: rgba(54,214,195,.25); border-color: var(--teal); animation: bump .4s; }
.opt.wrong { opacity: .45; border-color: #ff7a7a; animation: shake .4s; }
@keyframes bump { 50% { transform: scale(1.03); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.why { min-height: 1.4em; margin: 10px 0 0; } .why em { color: var(--gold); font-style: normal; }
.adv { margin: 10px 0; padding: 10px 12px; background: rgba(0,0,0,.3); border-radius: 12px; }
.adv summary { cursor: pointer; font-weight: 800; color: var(--gold); }
.chart { width: 100%; max-width: 420px; display: block; margin: 6px 0; background: rgba(0,0,0,.25); border-radius: 8px; }
.term { display: grid; grid-template-columns: 130px 120px 1fr; gap: 8px; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
.term code { color: var(--teal); }
.healed { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); text-align: center; animation: pop .5s both; }
.healed h2 { color: var(--gold); }
.honesty { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: start; margin: 14px 0; }
.honesty > div { background: rgba(255,255,255,.07); border-radius: 12px; padding: 12px; font-size: 14px; } .honesty p { margin: 4px 0 0; }
.honesty .you { background: rgba(54,214,195,.15); }
.stars i { font-size: 40px; margin: 0 4px; }
.cert img { width: 100%; border-radius: 12px; display: block; }

.bubble { position: absolute; left: 0; top: 0; max-width: min(320px, 80vw); background: #fff; color: #172040; padding: 10px 14px; border-radius: 16px; font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.35); pointer-events: none; z-index: 5; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }

@media (max-width: 760px) {
  .loc-grid { grid-template-columns: 1fr; }
  .panel.side { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 52vh; border-radius: var(--r) var(--r) 0 0; }
  .hud-btns .btn { padding: 6px 10px; }
  .honesty { grid-template-columns: 1fr; }
  .term { grid-template-columns: 1fr 1fr; } .term span { grid-column: 1 / -1; color: var(--muted); }
  .evidence { flex-direction: column; gap: 4px; }
}
/* reduced motion: body.rm is set from the Settings toggle (defaults to the system preference) */
body.rm *, body.rm *::before, body.rm *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

/* ---- Mission: quiz-show bottom band, world stays visible above ---- */
.mission { position: absolute; left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; max-height: 48vh; overflow: auto;
  padding: 12px max(16px, calc((100% - 1100px) / 2)) 16px; border-radius: 22px 22px 0 0; border: 0; border-top: 2px solid rgba(255,214,90,.55);
  background: linear-gradient(180deg, rgba(8,16,44,.82), rgba(4,8,26,.96)); backdrop-filter: blur(10px); box-shadow: 0 -12px 40px rgba(0,0,0,.4); animation: band .45s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes band { from { transform: translateY(100%); } }
.mission .mhead { margin-bottom: 6px; gap: 12px; }
.meter { flex: 1; max-width: 260px; height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffb347, #ff5a3c); transition: width 1.2s cubic-bezier(.2,.9,.3,1); }
.mission .big { margin: 2px 0 8px; }
.feel { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; } .feel .big { margin: 0; }
.evidence { align-items: center; } .evidence > div:nth-child(2) { flex: 1; } .evidence p { margin: 2px 0; }
.q { font-size: clamp(17px, 2.1vw, 21px); font-weight: 700; text-align: center; margin: 2px 0 10px; padding: 10px 16px; border-radius: 14px; background: linear-gradient(90deg, transparent, rgba(255,214,90,.12), transparent); }
.q .power { display: block; margin-bottom: 2px; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { min-height: 64px; display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.3; }
.opt:hover { transform: translateY(-3px); }
.let { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,214,90,.2); color: var(--gold); font-weight: 900; }
.opt.right .let { background: var(--teal); color: #032; } .opt.wrong .let { background: #ff7a7a; color: #300; }
.why { text-align: center; margin: 8px 0 0; font-size: 15px; }
.healed .mhead b { font-size: 19px; color: var(--gold); } .healed .stars i { font-size: 28px; margin: 0 2px; }
.healed .honesty { grid-template-columns: 1fr 1fr auto; align-items: center; margin: 6px 0 0; }
.float { position: absolute; transform: translate(-50%, 0); font-weight: 900; font-size: 22px; color: #9dffc9; text-shadow: 0 2px 10px #000, 0 0 16px rgba(80,255,170,.6); pointer-events: none; animation: floatUp 2.2s ease-out forwards; white-space: nowrap; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
@media (max-width: 760px) {
  .opts { grid-template-columns: 1fr; gap: 6px; } .opt { min-height: 50px; padding: 8px 12px; }
  .mission { max-height: 56vh; } .meter { max-width: 120px; }
  .healed .honesty { grid-template-columns: 1fr; }
}

/* ---- settings, pledges (modal) ---- */
select { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); font: inherit; }
select option { background: #0b1534; }
.seg.cos button { font-size: 14px; }
.modal { position: absolute; inset: 0; background: rgba(2,6,20,.55); z-index: 40; }
.mbox { width: min(520px, calc(100% - 32px)); }
.setlist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; } .setlist .tog { min-height: 52px; }
.plist { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.pl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); }
.pl > span { flex: 1 1 200px; } .pl.done { background: rgba(54,214,195,.15); } .pl em { font-style: normal; color: var(--teal); font-weight: 800; }
.gcheck { flex: 1 1 100%; padding: 10px; border-radius: 10px; background: rgba(255,214,90,.12); } .gcheck .row { margin-top: 6px; }
.unlock { margin: 0; padding: 10px 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,214,90,.3), rgba(54,214,195,.25)); font-weight: 800; }

/* ---- tutorial spotlight ---- */
.spot { position: absolute; inset: 0; z-index: 30; pointer-events: none !important; }
.spot-hole { position: fixed; pointer-events: none; transition: left .45s, top .45s, width .45s, height .45s, border-radius .45s;
  box-shadow: 0 0 30px 18px rgba(2,6,20,.66), 0 0 0 200vmax rgba(2,6,20,.66); }
.spot-hole::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 3px solid var(--gold); animation: spotPulse 1.4s ease-in-out infinite; }
.spot.worldspot .spot-hole::after, .spot.worldspot .spot-hand { display: none; }
@keyframes spotPulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .35; transform: scale(1.06); } }
.spot-hand { position: absolute; right: -10px; bottom: -34px; width: 46px; height: 46px; transform: rotate(-20deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); animation: tapHand 1.2s ease-in-out infinite; }
@keyframes tapHand { 0%, 100% { transform: rotate(-20deg) translate(0, 0); } 50% { transform: rotate(-20deg) translate(-6px, -8px); } }
.spot-cap { position: fixed; margin: 0; background: #fff; color: #172040; padding: 12px 16px; border-radius: 16px; font-weight: 700; font-size: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.spot-skip { position: fixed; right: 16px; bottom: 16px; pointer-events: auto; background: rgba(10,20,48,.85); }

/* ---- Two Earths ---- */
.te { position: absolute; inset: 0; pointer-events: none; } .te > * { pointer-events: auto; }
.te-lab { position: absolute; top: calc(var(--hud, 70px) + 10px); transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; font-weight: 900; letter-spacing: 2px; font-size: 14px; white-space: nowrap; transition: opacity .3s; pointer-events: none !important; }
.te-lab.l { background: rgba(255,150,60,.85); color: #241000; } .te-lab.r { background: rgba(54,214,195,.9); color: #032; }
.te-div { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; cursor: ew-resize; touch-action: none; z-index: 2; }
.te-div::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 14px 3px rgba(150,240,255,.9); }
.te-knob { position: absolute; left: 50%; top: 52%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #172040; font-weight: 900; font-size: 20px; box-shadow: 0 0 20px rgba(150,240,255,.9); }
.te-panel { z-index: 3; text-align: start; }
.te-line { margin: 2px 0 8px; font-size: 15px; }
.pledge:not(:empty) { padding: 10px 12px; border-radius: 12px; background: rgba(54,214,195,.12); border: 1px solid rgba(54,214,195,.4); }
.pledge > span { color: var(--teal); font-weight: 800; } .pledge .row { margin-top: 8px; }
.te-panel .row.end { margin-top: 8px; }

/* ---- Time Lens ---- */
.lens { position: absolute; inset: 0; pointer-events: none; } .lens > * { pointer-events: auto; }

    if (b.mist || E.muggy > 0.2 || E.smog > 0.2) {

    for (let x = -60; x <= W + 60; x += 40) ctx.lineTo(x, gy + Math.sin(x * 0.01 + 1) * 4);
    ctx.lineTo(W + 60, H + 900); ctx.lineTo(-60, H + 900); ctx.fill();
    const G = (u, d) => [u * W - px * (0.8 + d), gy + d * (H - gy)];
    // farmland: striped fields and two irrigation canals running toward the viewer

      [0.08, 0.62].forEach((u0, i) => {

  heroScale() { return Math.max(0.75, Math.min(1.7, Math.min(this.W, this.H) / 480)); }
  drawHeroNow() {

  cloud(x, y, s, col, a) {

  }

  stacks(hz, a, px) {
    const { ctx, W, H, t } = this;
    [0.12, 0.2, 0.55].forEach((u, i) => {

  }

    const ctx = this.ctx;
    for (let i = 0; i < 3; i++) {

  drawParts(types) {
    const ctx = this.ctx;

let last = performance.now(), moodT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.obj[tw.key] = tw.from + (tw.to - tw.from) * tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  world.update(dt); world.render();
  world.orbi.talk = isSpeaking(); tut.update();
  if ((moodT += dt) > 0.5) { moodT = 0; setMood(1 - Math.max(0, ...Object.entries(world.E).filter(([k]) => !GOOD.has(k)).map(([, v]) => v))); } // music follows the world's health

  const redraw = () => drawMap(mctx, map.width, map.height, { marker: picked, dots: SITES.length ? SITES : null });
  const pick = (p) => {
    picked = p; redraw();
    const none = hasData && !p.site; go.disabled = none; // no stored site (open sea): say so and load nothing
    s.querySelector('.picked').innerHTML = none ? `<b>${S.loc.noSite}</b>` : `<b>${esc(dispName(p))}</b> · ${biomeName(p.biome)} · ${p.lat}°, ${p.lon}°`;
    // what was asked for has no record of its own: say which site is shown instead

  // Scene art follows the resolved site.

  const near = (lat, lon, country) => {
    const hits = [];
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const s = resolveSite(lat + i * 0.25, lon + j * 0.25); if (s) hits.push([i * i + j * j, s]); }
    hits.sort((a, b) => a[0] - b[0]);
    return (hits.find(([, s]) => s.name === country) || hits[0] || [])[1] || null;
  };

  const at = (lat, lon, asked, country) => {

    const site = own || resolveSite(lat, lon) || (asked ? near(lat, lon, country) : null);

  q.oninput = () => {

    const hit = t => String(t).toLowerCase().includes(v);
    const out = SITES.filter(st => hit(st.name) || hit(placeName(st.name))).map(st => fromSite(st));
    for (const c of CITIES) if ([c.name, c.country, placeName(c.name), placeName(c.country)].some(hit)) { // a city without data resolves to its site

  go.onclick = () => picked && !go.disabled && travelTo(picked);

// ---------- 5. travel: zoom out to orbit, spin the globe, dive into the new world ----------
let data = null, place = null, busy = false;
async function travelTo(p, fromTitle = false, preloaded = null) {
  if (busy) return;
  if (!preloaded && save.mode !== 'sample') { // real data needs a stored NASA site (older saves: resolve it now)
    if (!p.site && hasData) { const site = resolveSite(p.lat, p.lon); if (site) p = { ...p, site, biome: siteBiome(site) }; }
    if (!p.site) { save.place = p; showLocation(); return; }
  }
  if (!preloaded && p.site && hasData) p = { ...p, biome: siteBiome(p.site) }; // scene follows the site (older saves kept the coarse-box biome)
  busy = true;
  screen(null); hideBubble(); hud.classList.add('hidden');
  const sp = world.space, R = Math.min(innerWidth, innerHeight) * 0.34;
  const loading = preloaded ? Promise.resolve(preloaded) : loadPlace(p, save.mode);
  spin = false; sp.cy = 0.5;
  if (sp.mix < 0.99) {
    sfx.whoosh(1);
    sp.lon = place ? place.lon : p.lon - 90; sp.lat = place ? place.lat : 10; sp.marker = place; sp.alpha = 1; sp.globeR = R * 3;
    tween(sp, 'zoom', 0.55, 0.9); tween(sp, 'globeR', R, 1.1); await tween(sp, 'mix', 1, 0.9);
  } else { sp.globeR = sp.globeR || R; tween(sp, 'globeR', R, 1); }
  sp.zoom = 1; sp.marker = p;
  const scan = h(`<div class="screen scan"><div class="ring"></div><p></p><small>${esc(dispName(p))} · ${biomeName(p.biome)}</small></div>`);
  screen(scan);
  let i = 0; const msg = scan.querySelector('p'); msg.textContent = S.scan[0];
  const ticker = setInterval(() => { msg.textContent = S.scan[++i % S.scan.length]; sfx.scan(); if (i > 5) msg.textContent = S.scanSlow; }, 1400);
  let dl = ((p.lon - sp.lon + 540) % 360) - 180;
  tween(sp, 'lat', p.lat * 0.8, 1.8); await tween(sp, 'lon', sp.lon + dl, 1.8);
  try { data = await loading; } finally { clearInterval(ticker); }
  place = p; save.place = p; persist();
  sfx.dive(); screen(null);
  world.setBiome(p.biome, Math.abs(p.lat * 31 + p.lon * 17) + 1, fromTitle && !world.biomeId);
  restoreImpacts();
  world.heroOn = true; world.orbi.on = true; world.look = save.look; world.heroPop = 0;
  sp.zoom = 1.25; tween(sp, 'zoom', 1, 1.4);
  tween(sp, 'globeR', Math.max(innerWidth, innerHeight) * 3, 1.1);
  tween(sp, 'alpha', 0, 1.1);
  await wait(650); world.flash = 0.9; world.flashColor = [255, 255, 255];
  await tween(sp, 'mix', 0, 0.6);
  sp.alpha = 1; busy = false;
  applyEffects();
  showHub(true);
}

// ---------- progress & effects ----------
const pid = () => (data?.site ? data.site.id : `${place.lat}_${place.lon}`);
const prog = () => (save.progress[pid()] ||= {});
const factorsPlayable = () => (data?.factors || []).filter(f => f.significant);
const factorsWeak = () => (data?.factors || []).filter(f => !f.significant);
let focus = null;
function applyEffects() {
  const tgt = Object.fromEntries(Object.keys(world.E).map(k => [k, 0]));
  for (const f of factorsPlayable()) {
    const e = effectOf(f), pr = prog()[f.id], rounds = pr?.stars?.length || 0;
    const left = pr?.done ? 0 : [1, 0.65, 0.3, 0][rounds];
    let v = f.intensity * left;
    if (focus && focus !== f.id) v *= 0.35;
    if (focus === f.id && rounds === 0) v = Math.max(v, 0.85);
    tgt[e] = Math.max(tgt[e], v);
  }
  world.target = tgt;
}
function restoreImpacts() { for (const f of factorsPlayable()) if (prog()[f.id]?.done) world.addImpact(effectOf(f), false); }
const totalStars = () => Object.values(save.progress).reduce((a, pl) => a + Object.values(pl).reduce((b, f) => b + (f.stars?.length || 0), 0), 0);
const rank = () => S.ranks[Math.min(S.ranks.length - 1, Math.floor(totalStars() / 3))];

// ---------- HUD ----------
const hud = h(`<div class="hud hidden"></div>`);
// Built from the strings, so it can be rebuilt when the language changes.
function buildHud() {
  hud.innerHTML = `<div class="id"><b class="nick"></b><span class="rank"></span></div>
  <div class="badge"></div>

}
buildHud();
ui.appendChild(hud);

new ResizeObserver(() => { if (!hud.classList.contains('hidden')) ui.style.setProperty('--hud', hud.offsetHeight + 'px'); }).observe(hud);
function updateHud() {
  hud.classList.remove('hidden');
  hud.querySelector('.nick').textContent = S.protector(save.nick);
  hud.querySelector('.rank').textContent = `${rank()} · ★ ${totalStars()}`;
  ui.style.setProperty('--hud', hud.offsetHeight + 'px'); // labels in Two Earths / Time Lens sit just under the HUD

// ---------- kid-friendly evidence wording ----------
// % change from the place's mean. A decrease can't be more than 100%, so big drops read "over 90%".
const pctOf = (change, mean) => { const p = Math.abs(change / mean) * 100; return change < 0 && p > 90 ? S.over90 : p.toFixed(0) + '%'; };
function sizeText(f) {
  const [y0, y1] = (f.period || '').split('-').map(Number);
  const total = f.change_total ?? f.slope_per_year * (y1 - y0), up = total >= 0;
  if (f.id === 't2m' || f.id === 'ts') return S.size[f.id](Math.abs(total).toFixed(1), up, y0);
  if (f.id === 'rh') return S.size.rh(Math.abs(total).toFixed(0), up, y0);
  // everything else as a % change from the place's own mean (soil is kg/m² of water, NDVI a 0-1 index)
  const pct = f.mean ? pctOf(total, f.mean) : Math.abs(total).toPrecision(2) + ' ' + unitName(f);
  return S.tidy((S.size[f.id] || S.size.other)(pct, up, y0));
}
const luck = p => S.luck(p);
const icon = e => ({ heat: '☀', cold: '❄', drying: '☁', flooding: '☔', drysoil: '▦', soggy: '◍', hotground: '♨', frost: '❅', steamy: '♒', wilting: '⚘',
  streams: '≈', drybed: '◇', snowpack: '❆', melt: '△', muggy: '≡', crisp: '✧', smog: '▒', clear: '✦', greener: '❦', browner: '❧' }[e]);

// Personal line from the long-term TREND (Sen's slope x years since birth), never from single noisy years.
function birthLine() {
  if (!save.birthYear || !data || data.source === 'sample') return '';
  const f = factorsPlayable().filter(x => !x.sample && S.birth[x.id]).sort((a, b) => a.p_value - b.p_value)[0];
  if (!f) return '';
  const [y0, y1] = String(f.period).split('-').map(Number), yrs = y1 - Math.max(save.birthYear, y0 || 0);
  if (!(yrs >= 8)) return S.birth.young;
  const ch = f.slope_per_year * yrs, a = Math.abs(ch);
  const v = f.id === 't2m' || f.id === 'ts' ? a.toFixed(1) : f.id === 'rh' ? a.toFixed(0) : f.mean ? pctOf(ch, f.mean) : a.toPrecision(2) + ' ' + unitName(f);
  return S.tidy(S.birth.line(save.birthYear, dispName(place), S.birth[f.id](v, ch >= 0)));
}

// ---------- 7. mission ----------
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
function chartSvg(f) {
  const s = f.series; if (!s) return '';
  const W = 320, H = 120, xs = s.years, ys = s.values, x0 = xs[0], x1 = xs[xs.length - 1];
  const lo = Math.min(...ys), hi = Math.max(...ys), X = x => 8 + ((x - x0) / (x1 - x0)) * (W - 16), Y = y => H - 10 - ((y - lo) / (hi - lo || 1)) * (H - 20);
  const pts = xs.map((x, i) => `${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  const ty = x => s.intercept + s.slope * x;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${S.adv.chart}">
    <polyline points="${pts}" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
    ${xs.map((x, i) => `<circle cx="${X(x).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="2" fill="#cfe9ff"/>`).join('')}
    <line x1="${X(x0)}" y1="${Y(ty(x0))}" x2="${X(x1)}" y2="${Y(ty(x1))}" stroke="#ffd65a" stroke-width="3" stroke-linecap="round"/>
    <text x="8" y="12" fill="#9fb3d1" font-size="10">${x0}</text><text x="${W - 32}" y="12" fill="#9fb3d1" font-size="10">${x1}</text></svg>`;
}
function advBlock(f) {
  if (!save.adv) return '';
  const row = (k, v, t) => `<div class="term"><b>${k}</b><code>${v}</code><span>${t}</span></div>`;
  return `<details class="adv" open><summary>${S.adv.title}</summary><p class="hint">${S.adv.chart}</p>${chartSvg(f)}
    ${row(S.adv.slope, S.perYear(f.slope_per_year, unitName(f)), S.adv.slopeT)}
    ${row(S.adv.p, f.p_value, S.adv.pT)}
    ${f.mk ? row(S.adv.mk, `S = ${f.mk.S}, Z = ${f.mk.Z}`, S.adv.mkT) + row(S.adv.tau, f.mk.tau, S.adv.tauT) + row(S.adv.n, f.mk.n, S.adv.nT) : ''}
    ${row(S.adv.strict, f.p_value < strictAlpha(data) ? S.adv.pass : S.adv.fail, S.adv.strictT(data.factors.length, +strictAlpha(data).toPrecision(2)))}
    <p class="hint">${esc(datasetLabel(f))} · ${esc(varName(f))} · ${esc(f.period)}</p></details>`;
}

// Camera lift: slide the world up so the hero and the effects stay visible above the bottom question band.

    const top = innerHeight - p.offsetHeight - (parseFloat(getComputedStyle(p).bottom) || 0), sc = world.heroScale();
    const want = world.heroY + 18 - top, max = world.heroY - 175 * sc - 70;

const LEFT = [1, 0.65, 0.3, 0];

async function startMission(f) {
  const e = effectOf(f), E = S.effects[e], P = prog(); P[f.id] ||= { stars: [] };
  const pr = P[f.id]; if (pr.done) { pr.done = false; pr.stars = []; }

    relift();

  world.override = { pose: 'hips', mood: 'joy', until: world.t + 5 };

// ---------- Two Earths finale: the scene drawn twice, REAL EARTH (NASA trend, unchanged) | YOUR EARTH (healed) ----------
function twoEarths(f, e, E, pr) {
  const open = !save.pledges.some(p => p.e === e && !p.done);

// ---------- Time Lens: drive the world with the real yearly anomaly series ----------
const lensFactors = () => (data?.factors || []).filter(f => f.significant && f.series && (data.source === 'sample' || !f.sample));
const lensMain = () => lensFactors().sort((a, b) => a.p_value - b.p_value)[0] || (data?.factors || []).find(f => f.series && !f.sample);
const runMean = (v, k = 2) => v.map((_, i) => { const a = v.slice(Math.max(0, i - k), i + k + 1); return a.reduce((p, q) => p + q, 0) / a.length; });
function showLens() {
  const main = lensMain(); if (!main) return;
  const years = main.series.years, y0 = years[0], y1 = years[years.length - 1];
  // per factor: 5-year running mean -> 0..intensity, oriented so the "problem" end of the record is strongest
  const maps = lensFactors().map(f => {
    const sm = runMean(f.series.values), lo = Math.min(...sm), hi = Math.max(...sm);
    const at = {}; f.series.years.forEach((y, i) => { const v = (sm[i] - lo) / (hi - lo || 1); at[y] = (f.direction === 'decreasing' ? 1 - v : v) * f.intensity; });
    return { e: effectOf(f), at, ys: f.series.years };
  });
  const born = save.birthYear ? Math.max(y0, Math.min(y1, save.birthYear)) : null, pct = y => ((y - y0) / (y1 - y0 || 1)) * 100;
  const vals = main.series.values, lo = Math.min(...vals), hi = Math.max(...vals);
  const spark = vals.map((v, i) => `${(pct(years[i])).toFixed(2)},${(36 - ((v - lo) / (hi - lo || 1)) * 32).toFixed(2)}`).join(' ');
  const cap = data.source === 'sample' ? S.lens.sample : data.source === 'radar' ? S.lens.radar(esc(dispName(place))) : S.lens.caption(esc(data.site ? siteLabel(data.site) : dispName(place)), esc(srcName(main.source)), esc(main.period));
  const s = screen(h(`<div class="screen lens">
    <p class="lens-cap ${data.source === 'sample' ? 'smp' : ''}">${cap}</p>
    <div class="lens-dock">
      <div class="lens-head"><b>⏳ ${S.lens.title}</b><span class="lens-var">${esc(varName(main))}</span><button class="btn small ghost close">✕ ${S.lens.close}</button></div>
      <div class="lens-track">
        <svg class="lens-spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${spark}"/></svg>
        <div class="lens-year">${y1}</div>
        <span class="mk" style="left:0%">${S.lens.start}</span>${born ? `<span class="mk star" style="left:${pct(born)}%" title="${S.lens.born}">★<span class="lbl"> ${S.lens.born}</span></span>` : ''}<span class="mk end" style="left:100%">${S.lens.today}</span>
        <input type="range" min="${y0}" max="${y1}" step="1" value="${y1}" aria-label="${S.lens.slider}">
      </div>
      <div class="row center">${btn('▶ ' + S.lens.play, 'primary small play')}${born ? btn('★ ' + S.lens.birth, 'ghost small jump') : ''}</div>
    </div></div>`));
  hideBubble(); focus = null; world.fastFx = true;
  const range = s.querySelector('input'), label = s.querySelector('.lens-year'), playB = s.querySelector('.play');
  let cur = null, playing = false;
  const setYear = (y, sound = true) => {
    y = Math.round(y); range.value = y;
    label.textContent = y; label.style.left = `calc(${pct(y)}% + ${(0.5 - pct(y) / 100) * 28}px)`;
    if (y === cur) return; cur = y; if (sound) sfx.tick();
    const tgt = Object.fromEntries(Object.keys(world.E).map(k => [k, 0]));
    for (const m of maps) { const near = m.ys.reduce((a, b) => (Math.abs(b - y) < Math.abs(a - y) ? b : a)); tgt[m.e] = Math.max(tgt[m.e], m.at[near]); }
    world.target = tgt;
  };
  setYear(y1, false);
  range.oninput = () => { playing = false; paused = false; playB.innerHTML = '▶ ' + S.lens.play; setYear(+range.value); };
  let paused = false; // Play sweeps first year -> today in ~8 s; after Pause it resumes from where it stopped
  playB.onclick = () => {
    if (playing) { playing = false; paused = true; playB.innerHTML = '▶ ' + S.lens.play; return; }
    const from = paused && +range.value < y1 ? +range.value : y0; paused = false;
    playing = true; playB.innerHTML = '❚❚ ' + S.lens.pause;
    const t0 = performance.now(), dur = 8000 * (y1 - from) / (y1 - y0 || 1);
    const step = now => {
      if (!playing || !s.isConnected) return;
      const k = Math.min(1, (now - t0) / dur); setYear(from + (y1 - from) * k);
      if (k < 1) requestAnimationFrame(step); else { playing = false; playB.innerHTML = '▶ ' + S.lens.play; }
    };
    requestAnimationFrame(step);
  };
  s.querySelector('.jump')?.addEventListener('click', () => { playing = false; paused = false; playB.innerHTML = '▶ ' + S.lens.play; setYear(born); });
  s.querySelector('.close').onclick = () => { playing = false; applyEffects(); showHub(); }; // the world eases back to today's game state
  relift('.lens-dock');
}

// ---------- 8. certificate ----------
function showCert() {
  const P = prog(), healed = factorsPlayable().filter(f => P[f.id]?.done).map(f => S.effects[effectOf(f)].name.toLowerCase());
  const list = healed.length ? S.joinList(healed) : S.firstSigns;
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1200, 800); g.addColorStop(0, '#0b1a44'); g.addColorStop(1, '#1b4d6b');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 800);
  x.strokeStyle = '#ffd65a'; x.lineWidth = 6; x.strokeRect(30, 30, 1140, 740); x.lineWidth = 1.5; x.strokeRect(46, 46, 1108, 708);
  x.direction = S.dir; x.textAlign = 'center'; x.fillStyle = '#ffd65a'; x.font = `700 30px ${FONT()}`; x.fillText(S.cert.heading.toUpperCase(), 600, 130);
  x.fillStyle = '#cfe0ff'; x.font = `24px ${FONT()}`; x.fillText(S.cert.awarded, 600, 200);
  x.fillStyle = '#fff'; x.font = `800 68px ${FONT()}`; x.fillText(S.protector(save.nick), 600, 285);
  x.fillStyle = '#e6eeff'; x.font = `26px ${FONT()}`;
  const words = S.cert.body(place ? dispName(place) : S.earth, list).split(' '); let line = '', y = 360;
  for (const w of words) { if (x.measureText(line + w).width > 900) { x.fillText(line, 600, y); line = ''; y += 40; } line += w + ' '; }
  x.fillText(line, 600, y);
  x.fillStyle = '#ffd65a'; x.font = `700 28px ${FONT()}`;
  x.fillText(`${S.cert.rank}: ${rank()}   ·   ★ ${totalStars()}   ·   ${S.cert.date}: ${new Date().toLocaleDateString(S.dateLocale)}`, 600, 560);
  const nDone = save.pledges.filter(p => p.done).length;
  if (nDone) { x.fillStyle = '#36d6c3'; x.font = `800 22px ${FONT()}`; x.fillText('★ ' + S.pledge.badge(nDone) + ' ★', 600, 704); x.fillStyle = '#ffd65a'; }
  x.beginPath(); x.arc(600, 640, 34, 0, 7); x.fill(); x.fillStyle = '#2f9e44'; x.beginPath(); x.ellipse(600, 640, 11, 22, 0.5, 0, 7); x.fill();
  x.strokeStyle = '#fff'; x.lineWidth = 3; x.beginPath(); x.ellipse(600, 640, 30, 11, -0.4, 0, 7); x.stroke();
  x.fillStyle = '#9fb3d1'; x.font = `18px ${FONT()}`; x.fillText(S.cert.footer, 600, 730);
  const url = c.toDataURL('image/png');
  c.toBlob(b => { const a = ui.querySelector('.cert a[download]'); if (b && a) a.href = URL.createObjectURL(b); }, 'image/png');
  const s = screen(h(`<div class="screen panel center cert"><img alt="${S.cert.heading}" src="${url}">
    <div class="row center"><a class="btn primary" download="protector-certificate.png" href="${url}">${S.cert.download}</a><button class="btn ghost">${S.cert.close}</button></div></div>`));
  sfx.star(); world.heal(); s.querySelector('button.ghost').onclick = () => (data ? showHub() : showTitle());
}

// ---------- Trend Radar input: ?radar=<url> or postMessage({ type: 'protector:radar', data }) ----------
let pendingRadar = null, radarNotice = '';
const heroReady = () => !!(save.nick && save.look);
const radarPlace = d => makePlace(d.lat, d.lon, d.name || undefined, BIOMES[d.biome] ? d.biome : undefined); // still rounded to 1 degree
function startCreator() { // same world state the story leaves behind, without the story
  if (ui.querySelector('.creator, .intro')) return; // creator already open, or the story will open it
  spin = false; world.space.mix = 0; world.orbi.on = true; world.orbi.glow = 0.5;
  if (!world.biomeId) world.setBiome('forest', 3, true);
  showCreator();
}
function useRadar(d) {
  if (!heroReady()) { pendingRadar = d; startCreator(); return; }
  if (busy) { setTimeout(() => useRadar(d), 400); return; }
  travelTo(radarPlace(d), !world.biomeId, d);
}
function radarFailed() {
  radarNotice = S.radarBad;
  if (!heroReady()) startCreator(); else if (!busy) showLocation();
}
async function loadRadarUrl(src) {
  let d = null;
  try {
    const u = new URL(src, location.href);
    if (!['http:', 'https:', 'file:'].includes(u.protocol)) throw new Error('unsupported URL');
    d = validateRadar(await JsonProvider(() => u.href).get());
  } catch (e) { console.warn('Trend Radar file could not be loaded:', e); }
  d ? useRadar(d) : radarFailed();
}
function onRadarMessage(e) {
  let m = e.data;
  if (typeof m === 'string') { try { m = JSON.parse(m); } catch { return; } } // plain data only, never evaluated
  if (!m || typeof m !== 'object' || m.type !== 'protector:radar') return;
  const d = validateRadar(m.data);
  if (d) useRadar(d); else { console.warn('Ignored an invalid Trend Radar message'); radarFailed(); }
}
addEventListener('message', onRadarMessage);
document.addEventListener('message', onRadarMessage); // react-native-webview on Android posts here

// ---------- language: English / Arabic (saved on this device) ----------
// Each button is labelled in its own language, as language pickers usually are.
function langSeg() { return `<div class="seg langseg" role="group" aria-label="${S.langLabel}"><button data-l="en" lang="en" dir="ltr" class="${S.lang === 'en' ? 'on' : ''}">English</button><button data-l="ar" lang="ar" dir="rtl" class="${S.lang === 'ar' ? 'on' : ''}">العربية</button></div>`; }
function bindLang(root, fromSettings) {
  root.querySelectorAll('.langseg button').forEach(b => (b.onclick = () => {
    if (b.dataset.l === S.lang) return;
    save.lang = b.dataset.l; persist(); applyLang();
    // redraw whatever is on screen in the new language
    if (ui.querySelector('.title-screen')) showTitle();
    else if (ui.querySelector('.loc')) showLocation();
    else if (ui.querySelector('.creator')) showCreator();
    else if (data && !busy) showHub();
    if (fromSettings) { root.remove(); showSettings(); }
  }));
}
function applyLang() {
  setLang(save.lang);
  ui.lang = S.lang; ui.dir = S.dir; document.title = S.docTitle; // the game UI only; the canvas world is not mirrored
  setVoiceLang(S.lang); hideBubble(); buildHud();
  if (data && !hud.classList.contains('hidden')) updateHud();
}
applyLang();
showTitle();
const radarParam = new URLSearchParams(location.search).get('radar');
if (radarParam) loadRadarUrl(radarParam);
return {  };
})();
})();
</script>
